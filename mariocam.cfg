// MarioCam XT 0.1 - run with: exec mariocam.cfg
// These are ordinary rebindable console commands.
// This file changes only HOME, LEFTARROW and RIGHTARROW.
bind "HOME" "mariocam_reset"
bind "LEFTARROW" "mariocam_left"
bind "RIGHTARROW" "mariocam_right"
echo "MarioCam XT: HOME = c1a0 reset; LEFT/RIGHT = relative 45-degree turns."

// We're allowed to use 4 to 999 FPS. So we keep this disabled.
bxt_hud_incorrect_fps_indicator 0



